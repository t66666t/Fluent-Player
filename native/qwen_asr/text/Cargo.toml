[package]
name = "fluent-asr-text"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[lib]
crate-type = ["staticlib"]

[dependencies]
lindera = { version = "=6.2.0", default-features = false, features = ["embed-ipadic", "embed-ko-dic"] }
serde_json = "=1.0.151"
unicode-normalization = "=0.1.24"
unicode-segmentation = "=1.12.0"

[profile.release]
panic = "unwind"
codegen-units = 1
lto = "thin"
