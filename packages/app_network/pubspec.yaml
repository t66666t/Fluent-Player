name: app_network
description: Device proxy resolution for Fluent Player.
version: 1.0.0
publish_to: none
environment:
  sdk: ^3.8.1
  flutter: '>=3.32.0'
dependencies:
  flutter:
    sdk: flutter
flutter:
  plugin:
    platforms:
      android:
        package: com.example.app_network
        pluginClass: AppNetworkPlugin
      ios:
        pluginClass: AppNetworkPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: AppNetworkPlugin
        sharedDarwinSource: true
      windows:
        pluginClass: AppNetworkPluginCApi
      linux:
        pluginClass: AppNetworkPlugin
