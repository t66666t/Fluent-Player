allprojects {
    repositories {
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/' }
        google()
        mavenCentral()
    }
}

// 统一所有模块（含第三方插件）的 JVM 目标版本，解决 photo_manager、desktop_drop 等插件编译冲突
subprojects {
    if (project.name == 'integration_test') {
        // Flutter uses dynamic versions here, which require remote Maven metadata
        // even when the matching release artifacts are already cached.
        configurations.configureEach {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'androidx.test' &&
                    details.requested.name in ['runner', 'rules'] &&
                    details.requested.version == '1.2+') {
                    details.useVersion '1.2.0'
                }
                if (details.requested.group == 'androidx.test.espresso' &&
                    details.requested.name == 'espresso-core' &&
                    details.requested.version == '3.3+') {
                    details.useVersion '3.3.0'
                }
            }
        }
    }
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            if (project.name == 'sherpa_onnx_android') {
                // GetApi(17) works with the newer OCR/alignment runtime, but
                // Android also requires the exact ELF symbol version tag.
                // Rebind generated copies to the AAR actually selected for each
                // app variant. Keep the Pub cache and all native code intact.
                def sourceJni = project.file('src/main/jniLibs')
                def rebindScript = rootProject.file('../tool/rebind_sherpa_onnx.dart')
                def properties = new Properties()
                rootProject.file('local.properties').withInputStream { properties.load(it) }
                def dartName = System.getProperty('os.name').toLowerCase().contains('windows') ? 'dart.exe' : 'dart'
                def dart = new File(properties.getProperty('flutter.sdk'), "bin/cache/dart-sdk/bin/${dartName}")
                project.android.sourceSets.main.jniLibs.setSrcDirs([])
                project.android.libraryVariants.all { variant ->
                    def variantName = variant.name
                    def title = variantName.capitalize()
                    def generatedJni = project.layout.buildDirectory.dir("model_center_jni/${variantName}")
                    def ortReference = project.layout.buildDirectory.dir("model_center_ort/${variantName}")
                    def runtimeAar = rootProject.project(':app').configurations
                        .getByName("${variantName}RuntimeClasspath").incoming.artifactView {
                            componentFilter { id ->
                                id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier &&
                                    id.group == 'com.microsoft.onnxruntime' && id.module == 'onnxruntime-android'
                            }
                        }.files
                    def prepareJni = project.tasks.register("prepare${title}ModelCenterJni", Sync) {
                        from sourceJni
                        exclude '**/libonnxruntime.so'
                        include '**/*.so'
                        into generatedJni
                        inputs.file(rebindScript)
                        inputs.files(runtimeAar)
                        outputs.dir(ortReference)
                        doLast {
                            project.sync {
                                from project.zipTree(runtimeAar.singleFile)
                                include 'jni/**/libonnxruntime.so'
                                into ortReference
                            }
                            project.exec {
                                commandLine dart.absolutePath, rebindScript.absolutePath,
                                    generatedJni.get().asFile.absolutePath,
                                    new File(ortReference.get().asFile, 'jni').absolutePath
                            }
                        }
                    }
                    project.android.sourceSets.getByName(variantName).jniLibs.srcDir(generatedJni)
                    project.tasks.matching { it.name == "merge${title}JniLibFolders" }.configureEach {
                        dependsOn prepareJni
                    }
                }
            }
            project.android {
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "17"
            }
        }
    }
}

// Expose SDK versions for Android subprojects (Flutter plugins usually read these)
ext {
    compileSdkVersion = 34
    targetSdkVersion = 34
    minSdkVersion = 24
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

// As a safeguard, ensure any Android plugins applied in subprojects use SDK 34
gradle.beforeProject { p ->
    p.plugins.withId("com.android.application") {
        def androidExt = p.extensions.findByName("android")
        if (androidExt != null) {
            androidExt.compileSdkVersion = 34
            androidExt.defaultConfig {
                targetSdkVersion 34
            }
        }
    }
    p.plugins.withId("com.android.library") {
        def androidExt = p.extensions.findByName("android")
        if (androidExt != null) {
            androidExt.compileSdkVersion = 34
            androidExt.defaultConfig {
                targetSdkVersion 34
            }
        }
    }
}
